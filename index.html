    <h1>Gato</h1>
    <p>El gato es un animal doméstico muy popular en todo el mundo. Es conocido por su agilidad, independencia y su capacidad para cazar ratones. Los gatos pueden ser de diferentes razas, colores y tamaños, y son apreciados por su compañía y su belleza.</p>
